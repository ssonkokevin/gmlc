        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An LBS client key. X-API-Key with the same key is accepted as an alternative."
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: The operator key from GMLC_ADMIN_KEY.
    opsSession:
      type: apiKey
      in: cookie
      name: GMLC_OPS
      description: HttpOnly console session cookie set by POST /v1/ops/session.
    opsCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The CSRF token returned by the session call; required on unsafe ops methods.

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
    AdminKeyHeader:
      name: X-Admin-Key
      in: header
      required: false
      schema:
        type: string
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentIdPath:
      name: consentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackedIdPath:
      name: trackedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit100:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    OpsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Range:
      name: range
      in: query
      required: false
      schema:
        allOf:
          - $ref: '#/components/schemas/RangeKey'
        default: 24h
    Bucket:
      name: bucket
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BucketKey'

  responses:
    BadRequest:
      description: The request is not acceptable as sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorised:
      description: A valid API key is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource, or it belongs to another tenant/client.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: The client has reached its allowance; see Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpsUnauthorised:
      description: An operator session is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpsForbidden:
      description: CSRF token missing, or the role lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem. `code` is stable where present.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          allOf:
            - $ref: '#/components/schemas/ProblemCode'
          description: Stable identifier, for example PRIVACY_NOT_SATISFIED or LIMIT_OUT_OF_RANGE.
      additionalProperties: true

    Health:
      type: object
      properties:
        service:
          type: string
          const: gmlc
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
        database:
          type: string
          enum: [UP, DOWN]
        capabilities:
          type: string
          enum: [UP, INVALID]
        capabilityProfileVersion:
          type: string
        capabilitySource:
          type: string
          enum: [bundled, database]
        status:
          type: string
          enum: [UP, DOWN]
        reason:
          type: string
      required: [service, version, checkedAt, database, status]

    CapabilityProfile:
      type: object
      description: Validated capability profile. Shape is owned by CapabilityProfileValidator.
      additionalProperties: true

    ClientMe:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
        maxAccuracyM:
          type: integer
        ratePerSecond:
          type: integer
        ratePerDay:
          type: integer
        ipAllowlist:
          type: array
          items:
            type: string
      required: [clientId, tenantId, name, purposes, maxAccuracyM, ratePerSecond, ratePerDay, ipAllowlist]

    LocationRequestInput:
      type: object
      description: The subject is MSISDN, IMSI or both. The service decides which pair is sufficient.
      properties:
        msisdn:
          type: string
          pattern: '^[0-9]{7,15}$'
        imsi:
          type: string
          pattern: '^[0-9]{14,15}$'
        purpose:
          type: string
          pattern: '^[A-Z_]{3,32}$'
        accuracyMeters:
          type: integer
          minimum: 1
          maximum: 100000
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
        idempotencyKey:
          type: string
          maxLength: 80
      required: [purpose]

    LocationView:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        state:
          type: string
          enum: [RECEIVED, AUTHORISED, PRIVACY_CHECKED, ROUTED, REQUESTED, ANSWERED, TIMEOUT, FAILED, DELIVERED]
        purpose:
          type: string
        priority:
          type: string
        accuracyRequestedM:
          type: integer
        errorCode:
          type: string
        errorDetail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        replayed:
          type: boolean
        result:
          $ref: '#/components/schemas/LocationResult'

    LocationResult:
      type: object
      description: |
        The position and everything that qualifies it. A reader that takes only
        latitude and longitude is reading a circle of `uncertaintyM` metres, no
        older than `ageSeconds`, from `method`.
      properties:
        method:
          type: string
        shape:
          type: string
          enum: [POINT, CIRCLE, ELLIPSE, POLYGON, ARC]
        latitude:
          type: number
        longitude:
          type: number
        uncertaintyM:
          type: integer
        confidence:
          type: integer
        ageSeconds:
          type: integer
        accuracyRequestedM:
          type: integer
        accuracyFulfilled:
          type: boolean
        servingCell:
          type: string
        engine:
          type: string
        positioningNode:
          type: string
        producedAt:
          type: string
          format: date-time
        methodsAttempted:
          type: array
          items:
            type: string

    ConsentGrantRequest:
      type: object
      properties:
        msisdn:
          type: string
          pattern: '^[0-9]{7,15}$'
        imsi:
          type: string
          pattern: '^[0-9]{14,15}$'
        purpose:
          type: string
          pattern: '^[A-Z_]{3,32}$'
        channel:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{2,16}$'
        expiresAt:
          type: string
          format: date-time
        evidence:
          description: Free-form JSON stored verbatim.
      required: [purpose]

    ConsentView:
      type: object
      properties:
        consentId:
          type: string
          format: uuid
        subjectRef:
          type: string
        purpose:
          type: string
        status:
          type: string
          enum: [PENDING, GRANTED, REVOKED, EXPIRED]
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    CellPage:
      type: object
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CellSummary'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
      required: [cells, limit, offset, total]

    CellSummary:
      type: object
      properties:
        rat:
          type: string
        cellIdentity:
          type: string
        areaCode:
          type: string
        siteName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        shape:
