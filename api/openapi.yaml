openapi: 3.1.0
info:
  title: GMLC Location Gateway API
  version: 0.1.0
  summary: Le location API, operator console API and OMA MLP adapter.
  description: |
    This file is the committed contract for the gateway's HTTP surface. It is
    the source of truth for the frontend and is checked against the running
    Spring mappings by `ApiSpecDriftTest`; the check fails when a controller
    mapping is absent here or a path here has no controller.

    Three credentials are used and they are not interchangeable:

    * `apiKey` - an LBS client key, sent as `Authorization: Bearer <key>` or as
      `X-API-Key`. Required on `/v1/*` except health, admin and ops, and on
      `/mlp`.
    * `adminKey` - the operator key from `GMLC_ADMIN_KEY`, sent as
      `X-Admin-Key`. Required on `/v1/admin/*`. When `GMLC_ADMIN_KEY` is blank
      the admin surface answers 404 and is effectively absent.
    * `opsSession` - the console session cookie `GMLC_OPS`, set by
      `POST /v1/ops/session`. State-changing ops calls must also echo the
      session's CSRF token in `X-CSRF-Token`. An API key is ignored on ops
      routes.

    Errors are RFC 7807 `application/problem+json`. `code` is a stable
    identifier where the table below names one; `title` and `detail` are for
    people and may be reworded.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8082
    description: Local default (GMLC_PORT)
tags:
  - name: Le
    description: Client-facing location requests, consent and cell reads.
  - name: Admin
    description: Operator-key guarded writes that mint credentials or change the cell plan.
  - name: Capability
    description: The tenant's capability profile.
  - name: Health
    description: Liveness and readiness.
  - name: Ops session
    description: Operator sign-in, sign-out and who-am-I.
  - name: Ops dashboard
    description: Aggregates, request browser and deferred reporting.
  - name: Ops monitoring
    description: Recorded signalling exchanges, series, reports and CSV export.
  - name: Ops health
    description: Peer state and alert engine.
  - name: Ops locations
    description: Operator-initiated location requests.
  - name: Ops geofences
    description: Geofence definitions, arms and events.
  - name: Ops subscriptions
    description: Event subscriptions and webhook deliveries.
  - name: Ops tracking
    description: Tracked subjects, trails, schedules and notifier channels.
  - name: Ops configuration
    description: Versioned configuration changes with four-eyes approval.
  - name: Ops users
    description: Console accounts.
  - name: Ops access
    description: Roles, sessions, audit, policy and break-glass.
  - name: Ops administration
    description: Read access to the cell plan for operators.
  - name: MLP
    description: OMA MLP 3.x standard location immediate.
  - name: Console page
    description: Static single-page application entry points.

security:
  - apiKey: []

paths:
  /v1/locations:
    post:
      tags: [Le]
      summary: Submit a location request
      description: |
        Consent is checked before any signalling. The response names the
        request and its state but never echoes the subject. A replayed
        `Idempotency-Key` returns the original request; a request that has
        already finished answers 200, one still working answers 202.
      operationId: createLocation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequestInput'
      responses:
        '200':
          description: Accepted earlier and already final, or an idempotent replay.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationView'
        '202':
          description: Accepted and still working.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: No consent covers this subject for that purpose.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/QuotaExceeded'

  /v1/locations/{requestId}:
    get:
      tags: [Le]
      summary: Read one location request and its result
      operationId: getLocation
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: The request and, when complete, its result envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationView'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/consents:
    post:
      tags: [Le]
      summary: Record a consent grant
      operationId: grantConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantRequest'
      responses:
        '201':
          description: Consent recorded.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /v1/consents/{consentId}:
    get:
      tags: [Le]
      summary: Read a consent record
      operationId: getConsent
      parameters:
        - $ref: '#/components/parameters/ConsentIdPath'
      responses:
        '200':
          description: The consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentView'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Le]
      summary: Revoke a consent record
      operationId: revokeConsent
      parameters:
        - $ref: '#/components/parameters/ConsentIdPath'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/cells:
    get:
      tags: [Le]
      summary: List cells from the authoritative plan
      operationId: listCells
      parameters:
        - name: rat
          in: query
          required: false
          schema:
            type: string
            enum: [GSM, UMTS, LTE, NR]
        - name: area
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of the cell plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /v1/cells/{rat}/{cellIdentity}:
    get:
      tags: [Le]
      summary: Read one cell
      operationId: getCell
      parameters:
        - name: rat
          in: path
          required: true
          schema:
            type: string
            enum: [GSM, UMTS, LTE, NR]
        - name: cellIdentity
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The cell as stored, with derived geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/cdrs:
    get:
      tags: [Le]
      summary: Read this client's own CDRs
      operationId: listCdrs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The newest CDRs for the authenticated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /v1/clients/me:
    get:
      tags: [Le]
      summary: The authenticated client's own configuration
      operationId: getMe
      responses:
        '200':
          description: Configuration and limits. No key or key hash is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientMe'
        '401':
          $ref: '#/components/responses/Unauthorised'

  /v1/subscribers/{trackedId}/last-known:
    get:
      tags: [Le]
      summary: The client's last known fix for a tracked subject
      operationId: getLastKnown
      parameters:
        - name: trackedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A fix with its honesty envelope, or found=false with a reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastKnownView'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/capabilities:
    get:
      tags: [Capability]
      summary: The tenant's capability profile
      description: |
        The profile is the promise the API makes: methods per RAT, build state,
        and network feature flags. An invalid stored profile is a 503, never a
        partial claim. `X-Capability-Source` says `bundled` or `database`.
      operationId: getCapabilities
      responses:
        '200':
          description: The validated capability profile.
          headers:
            X-Capability-Source:
              schema:
                type: string
                enum: [bundled, database]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityProfile'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '503':
          description: The profile is invalid and is not served.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/health:
    get:
      tags: [Health]
      summary: Liveness, database and capability state
      description: Unauthenticated by design. The body carries no connection strings.
      operationId: health
      security: []
      responses:
        '200':
          description: Database and capability profile are usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unreachable or capability profile invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/admin/clients:
    post:
      tags: [Admin]
      summary: Register an API client and mint its key
      description: |
        The response is the only time the key is returned. With no admin key
        configured the route answers 404. Purposes are limited to the operator's
        permitted set; lawful interception is not among them.
      operationId: registerClient
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/AdminKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Client created; `apiKey` is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          description: The admin API is disabled on this deployment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A client with that name already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/cells:
    post:
      tags: [Admin]
      summary: Insert or update one cell
      operationId: upsertCell
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/AdminKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellInput'
      responses:
        '200':
          description: Existing cell updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellView'
        '201':
          description: New cell inserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          description: The admin API is disabled on this deployment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/cells/import:
    post:
      tags: [Admin]
      summary: Import cells from CSV
      description: |
        Dry run is the default: the report is the product until the operator
        asks to commit. The report lists every accepted and rejected row.
      operationId: importCells
      security:
        - adminKey: []
      parameters:
        - $ref: '#/components/parameters/AdminKeyHeader'
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Import report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellImportReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          description: The admin API is disabled on this deployment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /mlp:
    post:
      tags: [MLP]
      summary: OMA MLP standard location immediate
      description: |
        Accepts an MLP `slir` request and answers with `slia` XML. Operation
        errors are MLP faults in a 200 answer; only an oversized body is a
        transport error. The same API key, consent and audit rules apply as on
        the Le API.
      operationId: mlpSlir
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '200':
          description: An `slia` answer, including MLP faults.
          content:
            application/xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorised'
        '413':
          description: The request body exceeds 64k characters.
          content:
            application/xml:
              schema:
                type: string

  /console:
    get:
      tags: [Console page]
      summary: Operations console entry point
      description: Forwards to the built single-page application. Static assets under `/console/` are not API mappings.
      operationId: consolePage
      security: []
      responses:
        '200':
          description: The console HTML.
          content:
            text/html:
              schema:
                type: string

  /v1/ops/session:
    post:
      tags: [Ops session]
      summary: Sign in
      description: |
        Creates the session cookie and returns the CSRF token. This is the one
        ops route that does not require a session.
      operationId: opsLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsLoginRequest'
      responses:
        '200':
          description: Signed in. Sets `GMLC_OPS` and returns the session view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSessionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Bad credentials, TOTP or a locked account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Ops session]
      summary: Sign out
      operationId: opsLogout
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/me:
    get:
      tags: [Ops session]
      summary: Who am I
      operationId: opsMe
      security:
        - opsSession: []
      responses:
        '200':
          description: The current session and its permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSessionView'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'

  /v1/ops/summary:
    get:
      tags: [Ops dashboard]
      summary: Dashboard summary over a range
      operationId: opsSummary
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/throughput:
    get:
      tags: [Ops dashboard]
      summary: Request throughput series
      operationId: opsThroughput
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throughput'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/mix:
    get:
      tags: [Ops dashboard]
      summary: Method and outcome mix
      operationId: opsMix
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mix'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/deferred:
    get:
      tags: [Ops dashboard]
      summary: Deferred reporting status
      operationId: opsDeferred
      security:
        - opsSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deferred'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/requests:
    get:
      tags: [Ops dashboard]
      summary: Browse location requests
      operationId: opsRequests
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Bucket'
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: protocol
          in: query
          required: false
          schema:
            type: string
        - name: purpose
          in: query
          required: false
          schema:
            type: string
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: recordStatus
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/OpsLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/requests/{requestId}:
    get:
      tags: [Ops dashboard]
      summary: One request in detail
      description: Identifiers are masked unless `reveal=true` and the role carries REVEAL_IDENTIFIERS.
      operationId: opsRequestDetail
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - name: reveal
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetail'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/exchanges:
    get:
      tags: [Ops monitoring]
      summary: Recorded signalling exchanges
      operationId: opsExchanges
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - name: protocol
          in: query
          required: false
          schema:
            type: string
        - name: recordStatus
          in: query
          required: false
          schema:
            type: string
        - name: requestId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OpsLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangePage'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/exchanges/series:
    get:
      tags: [Ops monitoring]
      summary: Exchange time series
      operationId: opsExchangeSeries
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Bucket'
        - name: protocol
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSeries'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/exchanges/export.csv:
    get:
      tags: [Ops monitoring]
      summary: Export exchanges as CSV
      operationId: opsExchangeExport
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - name: protocol
          in: query
          required: false
          schema:
            type: string
        - name: recordStatus
          in: query
          required: false
          schema:
            type: string
        - name: requestId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/reports:
    get:
      tags: [Ops monitoring]
      summary: Aggregated reports
      operationId: opsReports
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reports'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/reports/export.csv:
    get:
      tags: [Ops monitoring]
      summary: Export one report as CSV
      operationId: opsReportExport
      security:
        - opsSession: []
      parameters:
        - $ref: '#/components/parameters/Range'
        - name: report
          in: query
          required: false
          schema:
            type: string
            enum: [clients, purposes, rat, method, cell]
            default: clients
      responses:
        '200':
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/peers:
    get:
      tags: [Ops health]
      summary: Signalling peers and 3GPP interfaces
      operationId: opsPeers
      security:
        - opsSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerPage'
        '401':
