      tags: [Ops configuration]
      summary: Approve a change
      description: "Four-eyes: the approver must not be the requester."
      operationId: opsApproveConfigChange
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: changeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/configuration/changes/{changeId}/reject:
    post:
      tags: [Ops configuration]
      summary: Reject a change
      operationId: opsRejectConfigChange
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: changeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/administration/cells:
    get:
      tags: [Ops administration]
      summary: Read the cell plan
      operationId: opsAdministrationCells
      security:
        - opsSession: []
      parameters:
        - name: rat
          in: query
          required: false
          schema:
            type: string
            enum: [GSM, UMTS, LTE, NR]
        - $ref: '#/components/parameters/OpsLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/users:
    get:
      tags: [Ops users]
      summary: List console accounts
      operationId: opsUsers
      security:
        - opsSession: []
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
    post:
      tags: [Ops users]
      summary: Create a console account
      operationId: opsCreateUser
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/OpsObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/users/{userId}:
    patch:
      tags: [Ops users]
      summary: Change a user's role or enabled state
      operationId: opsPatchUser
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/users/{userId}/sign-out:
    post:
      tags: [Ops users]
      summary: End every session of a user
      operationId: opsSignOutUser
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '204':
          description: Sessions ended.
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/users/{userId}/password:
    post:
      tags: [Ops users]
      summary: Set a user's password
      operationId: opsSetUserPassword
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/access/roles:
    get:
      tags: [Ops access]
      summary: Role and permission matrix
      operationId: opsRoles
      security:
        - opsSession: []
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/sessions:
    get:
      tags: [Ops access]
      summary: Active operator sessions
      operationId: opsSessions
      security:
        - opsSession: []
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/sessions/{sessionId}/sign-out:
    post:
      tags: [Ops access]
      summary: End one operator session
      operationId: opsSignOutSession
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ops/access/audit:
    get:
      tags: [Ops access]
      summary: Operator audit trail
      operationId: opsAudit
      security:
        - opsSession: []
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, ALLOWED, DENIED, ERROR]
            default: ALL
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: before
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/OpsLimit'
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/policy:
    get:
      tags: [Ops access]
      summary: Effective access policy, including whether break-glass is enabled
      operationId: opsPolicy
      security:
        - opsSession: []
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/clients:
    get:
      tags: [Ops access]
      summary: Registered API clients
      operationId: opsAccessClients
      security:
        - opsSession: []
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/break-glass:
    get:
      tags: [Ops access]
      summary: Break-glass grants
      operationId: opsBreakGlassGrants
      security:
        - opsSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, PENDING, REVIEWED]
            default: ALL
        - $ref: '#/components/parameters/OpsLimit'
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
    post:
      tags: [Ops access]
      summary: Start a break-glass grant
      description: The code is checked against a stored SHA-256 hash; it is never stored or logged.
      operationId: opsStartBreakGlass
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
    delete:
      tags: [Ops access]
      summary: End the current break-glass grant
      operationId: opsEndBreakGlass
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'

  /v1/ops/access/break-glass/{grantId}/review:
    post:
      tags: [Ops access]
      summary: Review a break-glass grant
      operationId: opsReviewBreakGlass
      security:
        - opsSession: []
          opsCsrf: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OpsObject'
        '401':
          $ref: '#/components/responses/OpsUnauthorised'
        '403':
          $ref: '#/components/responses/OpsForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An LBS client key. X-API-Key with the same key is accepted as an alternative."
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: The operator key from GMLC_ADMIN_KEY.
    opsSession:
      type: apiKey
      in: cookie
      name: GMLC_OPS
      description: HttpOnly console session cookie set by POST /v1/ops/session.
    opsCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The CSRF token returned by the session call; required on unsafe ops methods.

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
    AdminKeyHeader:
      name: X-Admin-Key
      in: header
      required: false
      schema:
        type: string
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentIdPath:
      name: consentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackedIdPath:
      name: trackedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit100:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    OpsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Range:
      name: range
      in: query
      required: false
      schema:
        type: string
        default: 24h
    Bucket:
      name: bucket
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is not acceptable as sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorised:
      description: A valid API key is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource, or it belongs to another tenant/client.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: The client has reached its allowance; see Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpsUnauthorised:
      description: An operator session is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpsForbidden:
      description: CSRF token missing, or the role lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpsObject:
      description: JSON body. The ops surface is intentionally coarse here; the console's generated view will replace this description.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem. `code` is stable where present.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable identifier, for example PRIVACY_NOT_SATISFIED or LIMIT_OUT_OF_RANGE.
      additionalProperties: true

    Health:
      type: object
      properties:
        service:
          type: string
          const: gmlc
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
        database:
          type: string
          enum: [UP, DOWN]
        capabilities:
          type: string
          enum: [UP, INVALID]
        capabilityProfileVersion:
          type: string
        capabilitySource:
          type: string
          enum: [bundled, database]
        status:
          type: string
          enum: [UP, DOWN]
        reason:
          type: string
      required: [service, version, checkedAt, database, status]

    CapabilityProfile:
      type: object
      description: Validated capability profile. Shape is owned by CapabilityProfileValidator.
      additionalProperties: true

    ClientMe:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
        maxAccuracyM:
          type: integer
        ratePerSecond:
          type: integer
        ratePerDay:
          type: integer
        ipAllowlist:
          type: array
          items:
            type: string
      required: [clientId, tenantId, name, purposes, maxAccuracyM, ratePerSecond, ratePerDay, ipAllowlist]

    LocationRequestInput:
      type: object
      description: The subject is MSISDN, IMSI or both. The service decides which pair is sufficient.
      properties:
        msisdn:
          type: string
          pattern: '^[0-9]{7,15}$'
        imsi:
          type: string
          pattern: '^[0-9]{14,15}$'
        purpose:
          type: string
          pattern: '^[A-Z_]{3,32}$'
        accuracyMeters:
          type: integer
          minimum: 1
          maximum: 100000
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
        idempotencyKey:
          type: string
          maxLength: 80
      required: [purpose]

    LocationView:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        state:
          type: string
          enum: [RECEIVED, AUTHORISED, PRIVACY_CHECKED, ROUTED, REQUESTED, ANSWERED, TIMEOUT, FAILED, DELIVERED]
        purpose:
          type: string
        priority:
          type: string
        accuracyRequestedM:
          type: integer
        errorCode:
          type: string
        errorDetail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        replayed:
          type: boolean
        result:
          $ref: '#/components/schemas/LocationResult'

    LocationResult:
      type: object
      description: |
        The position and everything that qualifies it. A reader that takes only
        latitude and longitude is reading a circle of `uncertaintyM` metres, no
        older than `ageSeconds`, from `method`.
      properties:
        method:
          type: string
        shape:
          type: string
          enum: [POINT, CIRCLE, ELLIPSE, POLYGON, ARC]
        latitude:
          type: number
        longitude:
          type: number
        uncertaintyM:
          type: integer
        confidence:
          type: integer
        ageSeconds:
          type: integer
        accuracyRequestedM:
          type: integer
        accuracyFulfilled:
          type: boolean
        servingCell:
          type: string
        engine:
          type: string
        positioningNode:
          type: string
        producedAt:
          type: string
          format: date-time
        methodsAttempted:
          type: array
          items:
            type: string

    ConsentGrantRequest:
      type: object
      properties:
        msisdn:
          type: string
          pattern: '^[0-9]{7,15}$'
        imsi:
          type: string
          pattern: '^[0-9]{14,15}$'
        purpose:
          type: string
          pattern: '^[A-Z_]{3,32}$'
        channel:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{2,16}$'
        expiresAt:
          type: string
          format: date-time
        evidence:
          description: Free-form JSON stored verbatim.
      required: [purpose]

    ConsentView:
      type: object
      properties:
        consentId:
          type: string
          format: uuid
        subjectRef:
          type: string
        purpose:
          type: string
        status:
          type: string
          enum: [PENDING, GRANTED, REVOKED, EXPIRED]
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    CellPage:
      type: object
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CellSummary'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
      required: [cells, limit, offset, total]

    CellSummary:
      type: object
      properties:
        rat:
          type: string
        cellIdentity:
          type: string
        areaCode:
          type: string
        siteName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        shape:
          type: string
        radiusM:
          type: integer
        dataQuality:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CellView:
      allOf:
        - $ref: '#/components/schemas/CellSummary'
        - type: object
          properties:
            plmn:
              type: string
            cellCode:
              type: string
            antennaHeightM:
              type: number
            azimuthDeg:
              type: integer
            beamwidthDeg:
              type: integer
            coveragePolygon:
              type: object
              additionalProperties: true
            pci:
              type: integer
            arfcn:
              type: integer
            cellType:
              type: string
            dataSource:
              type: string
            lastVerified:
              type: string
              format: date

    CellInput:
      type: object
      properties:
        rat:
          type: string
          enum: [GSM, UMTS, LTE, NR]
        plmnMcc:
          type: string
        plmnMnc:
          type: string
        areaCode:
          type: string
        cellCode:
          type: string
        siteName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        antennaHeightM:
          type: number
        azimuthDeg:
          type: integer
        beamwidthDeg:
          type: integer
        radiusM:
          type: integer
        pci:
          type: integer
        arfcn:
          type: integer
        cellType:
          type: string
        dataSource:
          type: string
        dataQuality:
          type: integer
        lastVerified:
          type: string
          format: date

    CdrPage:
      type: object
      properties:
        cdrs:
          type: array
          items:
            $ref: '#/components/schemas/CdrRow'
        limit:
          type: integer
      required: [cdrs, limit]

    CdrRow:
      type: object
      properties:
        cdrId:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        resultCode:
          type: string
        recordStatus:
          type: string
          enum: [ANSWERED, FAILED, ABORTED, TIMEOUT]
        ratType:
          type: string
        positioningMethod:
          type: string
        methodsAttempted:
          type: array
          items:
            type: string
        accuracyRequestedM:
          type: integer
        accuracyAchievedM:
          type: integer
        accuracyFulfilled:
          type: boolean
        responseTimeMs:
          type: integer
        ageOfLocationS:
          type: integer
        shape:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        uncertaintyM:
          type: integer
        confidence:
          type: integer
        createdAt:
          type: string
          format: date-time

    ClientRegistrationRequest:
      type: object
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        purposes:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            enum: [EMERGENCY, SAFETY, FLEET_MANAGEMENT, COMMERCIAL_LBS, IOT_ASSET, TEST]
        maxAccuracyM:
          type: integer
          minimum: 1
          maximum: 100000
          default: 5000
        ratePerSecond:
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
        ratePerDay:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1000
        ipAllowlist:
          type: array
          items:
            type: string
      required: [name, purposes]

    ClientRegistrationResponse:
      type: object
      description: The only response that contains the API key.
      properties:
        clientId:
          type: string
          format: uuid
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
        maxAccuracyM:
          type: integer
        ratePerSecond:
          type: integer
        ratePerDay:
          type: integer
        ipAllowlist:
          type: array
          items:
            type: string
        apiKey:
          type: string
        apiKeyNote:
          type: string
      required: [clientId, tenantId, name, purposes, apiKey]

    LastKnownView:
      type: object
      properties:
        found:
          type: boolean
        reason:
          type: string
        trackedId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        purpose:
          type: string
        dataSource:
          type: string
          enum: [LAB_SIM, BENCH, REAL]
        fix:
          $ref: '#/components/schemas/Fix'
      required: [found, dataSource]

    Fix:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        resultId:
          type: string
          format: uuid
        method:
          type: string
        methodsAttempted:
          type: array
          items:
            type: string
        shape:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        uncertaintyM:
          type: integer
        confidence:
          type: integer
        ageSeconds:
          type: integer
        accuracyRequestedM:
          type: integer
        accuracyFulfilled:
          type: boolean
        servingCell:
          type: string
        engine:
          type: string
        positioningNode:
          type: string
        producedAt:
          type: string
          format: date-time

    OpsLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        totp:
          type: string
          pattern: '^[0-9]{6}$'
      required: [username, password, totp]

    OpsSessionView:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERATOR, ANALYST, VIEWER]
        permissions:
          type: array
          items:
            type: string
            enum:
              - VIEW_DASHBOARD
              - VIEW_REQUESTS
              - ACK_ALERTS
              - LOCATE
              - REVEAL_IDENTIFIERS
              - VIEW_RAW_SIGNALLING
              - EXPORT_CDR
              - MANAGE_GEOFENCES
              - MANAGE_NOTIFIERS
              - MANAGE_CLIENTS
              - MANAGE_CONFIG
              - MANAGE_USERS
              - MANAGE_LICENCE
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        environment:
          type: string
        dataSource:
          type: string
        breakGlass:
          type: boolean
        breakGlassExpiresAt:
          type: string
          format: date-time
