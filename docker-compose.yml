version: "3.8"

# Every variable here is declared in config.schema.json, and the defaults match
# application.yml. `tools/check_config.py` fails if the three disagree. Secrets
# are passed through by name only: no value is committed, and a blank secret
# leaves its feature off rather than falling back to a default credential.

services:
  postgres:
    # Pinned to 16: the Flyway 10.10 line in this project is tested against
    # PostgreSQL 16; 17 works in tests but is outside its support statement.
    image: postgres:16
    environment:
      POSTGRES_DB: gmlc
      POSTGRES_USER: gmlc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - gmlc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmlc"]
      interval: 5s
      timeout: 5s
      retries: 10

  gmlc:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # The core stack's network, so a Diameter or M3UA peer can be named by
    # service (dra:3868, custom-mme:3875, map-sccp:2905) without host ports.
    # Override CORE_NETWORK when the core compose project is renamed.
    networks:
      - core
    environment:
      GMLC_PORT: 8082
      GMLC_DB_URL: jdbc:postgresql://postgres:5432/gmlc
      GMLC_DB_USER: gmlc
      GMLC_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      GMLC_DB_POOL: ${GMLC_DB_POOL:-10}

      GMLC_ADMIN_KEY: ${GMLC_ADMIN_KEY:-}
      GMLC_SUBJECT_PEPPER: ${GMLC_SUBJECT_PEPPER:-}
      GMLC_EMERGENCY_OVERRIDE: ${GMLC_EMERGENCY_OVERRIDE:-false}
      GMLC_LCS_CLIENT_NAME: ${GMLC_LCS_CLIENT_NAME:-GMLC}
      GMLC_LOCATION_TRANSPORT: ${GMLC_LOCATION_TRANSPORT:-DIAMETER}

      GMLC_DIAMETER_ORIGIN_HOST: ${GMLC_DIAMETER_ORIGIN_HOST:-gmlc.local}
      GMLC_DIAMETER_ORIGIN_REALM: ${GMLC_DIAMETER_ORIGIN_REALM:-local}
      GMLC_DIAMETER_PEER_HOST: ${GMLC_DIAMETER_PEER_HOST:-}
      GMLC_DIAMETER_PEER_PORT: ${GMLC_DIAMETER_PEER_PORT:-3868}
      GMLC_DIAMETER_TIMEOUT_MS: ${GMLC_DIAMETER_TIMEOUT_MS:-5000}

      GMLC_M3UA_HOST: ${GMLC_M3UA_HOST:-}
      GMLC_M3UA_PORT: ${GMLC_M3UA_PORT:-2906}
      GMLC_M3UA_LOCAL_PC: ${GMLC_M3UA_LOCAL_PC:-0}
      GMLC_M3UA_REMOTE_PC: ${GMLC_M3UA_REMOTE_PC:-0}
      GMLC_M3UA_ROUTING_CONTEXT: ${GMLC_M3UA_ROUTING_CONTEXT:--1}
      GMLC_M3UA_LOCAL_GT: ${GMLC_M3UA_LOCAL_GT:-}
      GMLC_M3UA_NI: ${GMLC_M3UA_NI:-2}
      GMLC_M3UA_TIMEOUT_MS: ${GMLC_M3UA_TIMEOUT_MS:-5000}
      GMLC_MAP_MLC_NUMBER: ${GMLC_MAP_MLC_NUMBER:-}
      GMLC_MAP_HLR_PC: ${GMLC_MAP_HLR_PC:-0}

      GMLC_OPS_ENVIRONMENT: ${GMLC_OPS_ENVIRONMENT:-LAB}
      GMLC_OPS_SLO_P95_MS: ${GMLC_OPS_SLO_P95_MS:-0}
      GMLC_OPS_COOKIE_SECURE: ${GMLC_OPS_COOKIE_SECURE:-true}
      GMLC_OPS_SESSION_IDLE_MINUTES: ${GMLC_OPS_SESSION_IDLE_MINUTES:-15}
      GMLC_OPS_SESSION_ABSOLUTE_HOURS: ${GMLC_OPS_SESSION_ABSOLUTE_HOURS:-8}
      GMLC_OPS_LOCKOUT_THRESHOLD: ${GMLC_OPS_LOCKOUT_THRESHOLD:-5}
      GMLC_OPS_LOCKOUT_MINUTES: ${GMLC_OPS_LOCKOUT_MINUTES:-15}
      GMLC_OPS_TOTP_ISSUER: ${GMLC_OPS_TOTP_ISSUER:-GMLC}
      GMLC_OPS_TOTP_PERIOD_SECONDS: ${GMLC_OPS_TOTP_PERIOD_SECONDS:-30}
      GMLC_OPS_ARGON2_MEMORY_KIB: ${GMLC_OPS_ARGON2_MEMORY_KIB:-19456}
      GMLC_OPS_ARGON2_ITERATIONS: ${GMLC_OPS_ARGON2_ITERATIONS:-2}
      GMLC_OPS_ARGON2_PARALLELISM: ${GMLC_OPS_ARGON2_PARALLELISM:-1}
      # No default account: the console stays closed until an operator sets
      # these. Never commit a password or TOTP seed.
      GMLC_OPS_BOOTSTRAP_USER: ${GMLC_OPS_BOOTSTRAP_USER:-}
      GMLC_OPS_BOOTSTRAP_PASSWORD: ${GMLC_OPS_BOOTSTRAP_PASSWORD:-}
      GMLC_OPS_BOOTSTRAP_TOTP_SECRET: ${GMLC_OPS_BOOTSTRAP_TOTP_SECRET:-}
      GMLC_OPS_BREAK_GLASS_CODE_HASH: ${GMLC_OPS_BREAK_GLASS_CODE_HASH:-}
      GMLC_OPS_ALERTS_ENABLED: ${GMLC_OPS_ALERTS_ENABLED:-true}
      GMLC_OPS_ALERTS_EVAL_SECONDS: ${GMLC_OPS_ALERTS_EVAL_SECONDS:-60}
      GMLC_OPS_ALERTS_WINDOW_MINUTES: ${GMLC_OPS_ALERTS_WINDOW_MINUTES:-15}
      GMLC_OPS_ALERTS_MIN_FINISHED: ${GMLC_OPS_ALERTS_MIN_FINISHED:-10}
      GMLC_OPS_ALERTS_ERROR_RATE: ${GMLC_OPS_ALERTS_ERROR_RATE:-0.25}
      GMLC_OPS_ALERTS_PEER_FAILURES: ${GMLC_OPS_ALERTS_PEER_FAILURES:-3}
      GMLC_OPS_ALERTS_CELL_GAP: ${GMLC_OPS_ALERTS_CELL_GAP:-1}

      GMLC_WEBHOOKS_ENABLED: ${GMLC_WEBHOOKS_ENABLED:-true}
      GMLC_WEBHOOKS_FLUSH_SECONDS: ${GMLC_WEBHOOKS_FLUSH_SECONDS:-10}
      GMLC_WEBHOOKS_INITIAL_DELAY_SECONDS: ${GMLC_WEBHOOKS_INITIAL_DELAY_SECONDS:-15}
      GMLC_WEBHOOKS_TIMEOUT_SECONDS: ${GMLC_WEBHOOKS_TIMEOUT_SECONDS:-5}
      GMLC_WEBHOOKS_MAX_ATTEMPTS: ${GMLC_WEBHOOKS_MAX_ATTEMPTS:-5}
      GMLC_WEBHOOKS_BATCH_SIZE: ${GMLC_WEBHOOKS_BATCH_SIZE:-50}

      GMLC_TRACKING_SCHEDULES_ENABLED: ${GMLC_TRACKING_SCHEDULES_ENABLED:-true}
      GMLC_TRACKING_FLUSH_SECONDS: ${GMLC_TRACKING_FLUSH_SECONDS:-30}
      GMLC_TRACKING_INITIAL_DELAY_SECONDS: ${GMLC_TRACKING_INITIAL_DELAY_SECONDS:-45}
      GMLC_TRACKING_TIMEOUT_SECONDS: ${GMLC_TRACKING_TIMEOUT_SECONDS:-10}
      GMLC_TRACKING_MIN_INTERVAL_SECONDS: ${GMLC_TRACKING_MIN_INTERVAL_SECONDS:-300}
      GMLC_TRACKING_BATCH_SIZE: ${GMLC_TRACKING_BATCH_SIZE:-20}
      GMLC_TRACKING_NOTIFIER_KEY: ${GMLC_TRACKING_NOTIFIER_KEY:-}
    ports:
      - "8082:8082"

networks:
  core:
    external: true
    name: ${CORE_NETWORK:-5g-core-engine_core-net}

volumes:
  gmlc_postgres_data:
