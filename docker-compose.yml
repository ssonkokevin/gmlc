version: "3.8"

services:
  postgres:
    # Pinned to 16: the Flyway 10.10 line in this project is tested against
    # PostgreSQL 16; 17 works in tests but is outside its support statement.
    image: postgres:16
    environment:
      POSTGRES_DB: gmlc
      POSTGRES_USER: gmlc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - gmlc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmlc"]
      interval: 5s
      timeout: 5s
      retries: 10

  gmlc:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GMLC_PORT: 8082
      GMLC_DB_URL: jdbc:postgresql://postgres:5432/gmlc
      GMLC_DB_USER: gmlc
      GMLC_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "8082:8082"

volumes:
  gmlc_postgres_data:
