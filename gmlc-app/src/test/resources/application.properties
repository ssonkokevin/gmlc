# Test-wide defaults. The alert evaluator is a background writer: leaving it
# running would let a long test run change rows another test is asserting on.
# The classes that exercise the engine switch it on explicitly and call
# evaluate(...) at a chosen instant instead of waiting for a tick.
gmlc.ops.alerts.enabled=false

# The webhook flush is another background writer over the shared embedded
# database. Classes that exercise it call dispatchDue(...) at a chosen instant,
# so no test depends on a timer firing across contexts.
gmlc.webhooks.enabled=false
gmlc.webhooks.initial-delay-seconds=3600
