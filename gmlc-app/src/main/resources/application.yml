server:
  port: ${GMLC_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: gmlc
  datasource:
    url: ${GMLC_DB_URL:jdbc:postgresql://localhost:5432/gmlc}
    username: ${GMLC_DB_USER:gmlc}
    password: ${GMLC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${GMLC_DB_POOL:10}
      # Fail fast: a health check that waits 30 s for a dead database is useless.
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

gmlc:
  default-tenant-id: 1
  bundled-capability-profile: classpath:location/capability-profile.tenant-1.json
  version: 0.1.0
  # Guards client registration. Blank disables the admin surface entirely; set
  # it per deployment, never in a committed file.
  admin-key: ${GMLC_ADMIN_KEY:}
  # Keys the subscriber pseudonym in consent, CDR and audit rows. Blank falls
  # back to an unkeyed SHA-256, which anyone holding the database can reverse
  # for a known MSISDN list; set it per deployment.
  subject-pepper: ${GMLC_SUBJECT_PEPPER:}
  # Emergency requests bypass stored consent only when the operator says so.
  emergency-override: ${GMLC_EMERGENCY_OVERRIDE:false}
  # The name an MME shows its privacy rules as the requesting LCS client.
  lcs-client-name: ${GMLC_LCS_CLIENT_NAME:hamiltel-gmlc}
  # Diameter SLh/SLg towards the HSS and the MME. An empty peer-host leaves the
  # clients in the fail-closed "not configured" state: requests end with
  # SIGNALLING_NOT_CONFIGURED rather than a guessed position.
  diameter:
    origin-host: ${GMLC_DIAMETER_ORIGIN_HOST:gmlc.hamiltel.local}
    origin-realm: ${GMLC_DIAMETER_ORIGIN_REALM:hamiltel.local}
    peer-host: ${GMLC_DIAMETER_PEER_HOST:}
    peer-port: ${GMLC_DIAMETER_PEER_PORT:3868}
    timeout-ms: ${GMLC_DIAMETER_TIMEOUT_MS:5000}
  # M3UA towards the STP for the MAP face (2G/3G location). Point codes belong
  # to the operator, so none is committed: local-point-code 0 leaves the link
  # disabled and every MAP request fails closed. M3UA normally runs over SCTP;
  # this host has no SCTP provider for the JVM, so the transport is M3UA/TCP
  # and the lab gateway must accept that (see README).
  m3ua:
    host: ${GMLC_M3UA_HOST:}
    port: ${GMLC_M3UA_PORT:2905}
    local-point-code: ${GMLC_M3UA_LOCAL_PC:0}
    remote-point-code: ${GMLC_M3UA_REMOTE_PC:0}
    routing-context: ${GMLC_M3UA_ROUTING_CONTEXT:-1}
    local-global-title: ${GMLC_M3UA_LOCAL_GT:}
    network-indicator: ${GMLC_M3UA_NI:2}
    timeout-ms: ${GMLC_M3UA_TIMEOUT_MS:5000}

logging:
  level:
    root: INFO
    com.hamiltel.gmlc: INFO
