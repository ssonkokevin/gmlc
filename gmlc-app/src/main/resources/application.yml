server:
  port: ${GMLC_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: gmlc
  datasource:
    url: ${GMLC_DB_URL:jdbc:postgresql://localhost:5432/gmlc}
    username: ${GMLC_DB_USER:gmlc}
    password: ${GMLC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${GMLC_DB_POOL:10}
      # Fail fast: a health check that waits 30 s for a dead database is useless.
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

gmlc:
  default-tenant-id: 1
  bundled-capability-profile: classpath:location/capability-profile.tenant-1.json
  version: 0.1.0
  # Guards client registration. Blank disables the admin surface entirely; set
  # it per deployment, never in a committed file.
  admin-key: ${GMLC_ADMIN_KEY:}
  # Keys the subscriber pseudonym in consent, CDR and audit rows. Blank falls
  # back to an unkeyed SHA-256, which anyone holding the database can reverse
  # for a known MSISDN list; set it per deployment.
  subject-pepper: ${GMLC_SUBJECT_PEPPER:}
  # Emergency requests bypass stored consent only when the operator says so.
  emergency-override: ${GMLC_EMERGENCY_OVERRIDE:false}
  # The name an MME shows its privacy rules as the requesting LCS client.
  lcs-client-name: ${GMLC_LCS_CLIENT_NAME:hamiltel-gmlc}
  # Which interface answers a Le request. DIAMETER uses SLh/SLg towards an HSS
  # and an MME; MAP uses the SS7 face towards the HLR, MSC and SGSN below.
  location:
    transport: ${GMLC_LOCATION_TRANSPORT:DIAMETER}
  # Diameter SLh/SLg towards the HSS and the MME. An empty peer-host leaves the
  # clients in the fail-closed "not configured" state: requests end with
  # SIGNALLING_NOT_CONFIGURED rather than a guessed position.
  diameter:
    origin-host: ${GMLC_DIAMETER_ORIGIN_HOST:gmlc.hamiltel.local}
    origin-realm: ${GMLC_DIAMETER_ORIGIN_REALM:hamiltel.local}
    peer-host: ${GMLC_DIAMETER_PEER_HOST:}
    peer-port: ${GMLC_DIAMETER_PEER_PORT:3868}
    timeout-ms: ${GMLC_DIAMETER_TIMEOUT_MS:5000}
  # M3UA towards the STP for the MAP face (2G/3G location). Point codes belong
  # to the operator, so none is committed: local-point-code 0 leaves the link
  # disabled and every MAP request fails closed. M3UA normally runs over SCTP;
  # this host has no SCTP provider for the JVM, so the transport is M3UA/TCP
  # and the lab gateway must accept that (see README).
  m3ua:
    host: ${GMLC_M3UA_HOST:}
    port: ${GMLC_M3UA_PORT:2905}
    local-point-code: ${GMLC_M3UA_LOCAL_PC:0}
    remote-point-code: ${GMLC_M3UA_REMOTE_PC:0}
    routing-context: ${GMLC_M3UA_ROUTING_CONTEXT:-1}
    local-global-title: ${GMLC_M3UA_LOCAL_GT:}
    network-indicator: ${GMLC_M3UA_NI:2}
    timeout-ms: ${GMLC_M3UA_TIMEOUT_MS:5000}
  # The MAP face's own identity. mlc-number is the gateway's E.164 LCS number
  # as the HLR and serving node see it; a blank value leaves MAP disabled and
  # every exchanged request fails closed. hlr-point-code zero routes on SSN 6
  # at the M3UA peer's point code.
  map:
    mlc-number: ${GMLC_MAP_MLC_NUMBER:}
    hlr-point-code: ${GMLC_MAP_HLR_PC:0}
  # Operator console. Accounts are people, not API clients; the console never
  # consumes a client quota. The session cookie is Secure by default - a
  # plain-HTTP lab must set GMLC_OPS_COOKIE_SECURE=false explicitly, or the
  # browser will refuse to return the cookie and every call will be 401.
  ops:
    # LAB, BENCH or PRODUCTION. It labels every figure the console shows:
    # LAB_SIM or BENCH until the deployment says PRODUCTION, after which the
    # label reads REAL. Nothing else may claim a real-network source.
    environment: ${GMLC_OPS_ENVIRONMENT:LAB}
    # The p95 response-time objective shown against the measured percentile.
    # 0 means no objective has been agreed, so the console shows the
    # percentile alone and makes no SLO claim.
    slo-p95-ms: ${GMLC_OPS_SLO_P95_MS:0}
    cookie-secure: ${GMLC_OPS_COOKIE_SECURE:true}
    session-idle-minutes: ${GMLC_OPS_SESSION_IDLE_MINUTES:15}
    session-absolute-hours: ${GMLC_OPS_SESSION_ABSOLUTE_HOURS:8}
    lockout-threshold: ${GMLC_OPS_LOCKOUT_THRESHOLD:5}
    lockout-minutes: ${GMLC_OPS_LOCKOUT_MINUTES:15}
    totp-issuer: ${GMLC_OPS_TOTP_ISSUER:Hamiltel GMLC}
    totp-period-seconds: ${GMLC_OPS_TOTP_PERIOD_SECONDS:30}
    # Argon2id cost. The defaults are the OWASP recommendation; a test or a
    # constrained host may lower them, and existing hashes keep their cost.
    argon2-memory-kib: ${GMLC_OPS_ARGON2_MEMORY_KIB:19456}
    argon2-iterations: ${GMLC_OPS_ARGON2_ITERATIONS:2}
    argon2-parallelism: ${GMLC_OPS_ARGON2_PARALLELISM:1}
    # The first administrator, created only when that username does not exist.
    # Set these per deployment; blank leaves the console closed until an
    # account is inserted deliberately.
    bootstrap-username: ${GMLC_OPS_BOOTSTRAP_USER:}
    bootstrap-password: ${GMLC_OPS_BOOTSTRAP_PASSWORD:}
    bootstrap-totp-secret: ${GMLC_OPS_BOOTSTRAP_TOTP_SECRET:}
    # Alert thresholds, evaluated over recorded traffic and observed transport
    # outcomes. A peer is never probed: DOWN means exchanges were attempted and
    # failed. The values in force are returned by GET /v1/ops/peers so the
    # console shows what it is judging against.
    alerts:
      enabled: ${GMLC_OPS_ALERTS_ENABLED:true}
      eval-seconds: ${GMLC_OPS_ALERTS_EVAL_SECONDS:60}
      window-minutes: ${GMLC_OPS_ALERTS_WINDOW_MINUTES:15}
      min-finished: ${GMLC_OPS_ALERTS_MIN_FINISHED:10}
      error-rate-threshold: ${GMLC_OPS_ALERTS_ERROR_RATE:0.25}
      peer-failure-threshold: ${GMLC_OPS_ALERTS_PEER_FAILURES:3}
      cell-gap-threshold: ${GMLC_OPS_ALERTS_CELL_GAP:1}

logging:
  level:
    root: INFO
    com.hamiltel.gmlc: INFO
